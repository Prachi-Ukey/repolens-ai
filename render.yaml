services:
  - type: web
    name: repolens-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Ephemeral SQLite database path on the free instance (/tmp).
      # NOTE: Free Render web services do not support persistent disks.
      # Data will be lost on service restarts, redeployments, or free-tier spin-downs.
      - key: DATABASE_URL
        value: sqlite:////tmp/repolens.db
      # Ephemeral Chroma vector store directory on the free instance (/tmp).
      # NOTE: Free Render web services do not support persistent disks.
      # Vector collections and embeddings will be lost on service restarts, redeployments, or spin-downs.
      - key: CHROMA_PERSIST_DIRECTORY
        value: /tmp/chroma_data
      # Hosted LLM Provider (Google Gemini as default production provider)
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Supply GEMINI_API_KEY securely in the Render Dashboard (never hardcode in repo)
      - key: GEMINI_API_KEY
        sync: false
      # Alternative OpenAI configuration (set LLM_PROVIDER=openai if preferred)
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      # Free Local Embedding Provider (all-MiniLM-L6-v2, 384 dimensions)
      # Eliminates Gemini free-tier 30K TPM rate limit (HTTP 429: RESOURCE_EXHAUSTED).
      # Completely free: no paid tokens or external API dependencies for vector embeddings.
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_DIMENSION
        value: 384
      # Exact deployed frontend URL (e.g. https://repolens-ai.vercel.app); set in Render Dashboard
      - key: CORS_ORIGINS
        sync: false
